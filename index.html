<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TastyGrid — All Recipes (Modern Vibrant)</title>
  <meta name="description"
    content="TastyGrid — share tested home recipes, preserve family flavors, and make cooking simple and joyful for everyone." />
  <style>
    /* Modern Vibrant single-file styles (same as previous theme) */
    :root {
      --bg: #f4f7ff;
      --card: #fff;
      --muted: #52606d;
      --text: #071428;
      --accent: #ff6b6b;
      --accent2: #7c3aed;
      --header-bg: linear-gradient(90deg, rgba(124, 58, 237, 0.12), rgba(255, 107, 107, 0.08));
      --sidebar-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.95));
      --main-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.6), transparent);
      --shadow: 0 16px 40px rgba(12, 18, 30, 0.08);
      --radius: 12px;
      --trans: 220ms cubic-bezier(.2, .9, .3, 1);
      --maxw: 1200px;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial
    }

    a {
      color: inherit;
      text-decoration: none
    }

    .container {
      max-width: calc(var(--maxw) + 160px);
      margin: 0 auto;
      padding: 18px
    }

    /* header row */
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      background: var(--header-bg);
      padding: 10px;
      border-radius: 12px;
      box-shadow: var(--shadow)
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .logo-mark {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: inline-grid;
      place-items: center;
      font-weight: 800;
      color: white;
      font-size: 16px
    }

    .brand a {
      font-weight: 900;
      font-size: 1.25rem;
      padding: 6px 8px;
      border-radius: 8px;
      position: relative
    }

    .brand a .shimmer {
      background: linear-gradient(90deg, var(--accent), var(--accent2), #fff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      animation: shimmer 3.2s linear infinite;
      background-size: 200% 100%
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0
      }

      100% {
        background-position: -200% 0
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand a .shimmer {
        animation: none;
        color: var(--text)
      }
    }

    /* header center */
    .header-center {
      display: flex;
      gap: 12px;
      align-items: center
    }

    /* header right / search */
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 320px;
      max-width: 520px;
      width: 38%
    }

    .search {
      position: relative;
      width: 100%
    }

    .search input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: var(--card)
    }

    .suggestions {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      background: var(--card);
      border-radius: 10px;
      box-shadow: var(--shadow);
      max-height: 320px;
      overflow: auto;
      z-index: 90;
      display: none
    }

    .suggestions[aria-hidden="false"] {
      display: block
    }

    .suggest {
      display: flex;
      gap: 12px;
      padding: 10px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      align-items: center;
      cursor: pointer
    }

    .suggest img {
      width: 64px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover
    }

    .suggest h4 {
      margin: 0;
      font-size: 0.95rem
    }

    .suggest p {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem
    }

    /* row 2 layout */
    .row2 {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
      align-items: start;
      margin-top: 14px
    }

    @media (max-width:1000px) {
      .row2 {
        grid-template-columns: 260px 1fr
      }
    }

    @media (max-width:900px) {
      .row2 {
        grid-template-columns: 1fr
      }
    }

    /* sidebar */
    .sidebar {
      background: var(--sidebar-bg);
      padding: 14px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      height: calc(100vh - 220px);
      overflow: auto;
      position: sticky;
      top: 18px
    }

    .sidebar h3 {
      margin: 0 0 10px 0;
      color: var(--text)
    }

    .cat-list label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer
    }

    .cat-list label:hover {
      background: rgba(0, 0, 0, 0.03)
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .chip {
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.03)
    }

    .chip.active {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: white
    }

    /* main content */
    .content {
      padding: 6px 0;
      background: var(--main-bg);
      border-radius: 12px
    }

    .category {
      margin-bottom: 28px
    }

    .category h2 {
      font-size: 1.05rem;
      margin: 0 0 10px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text)
    }

    .grid {
      display: grid;
      gap: 16px
    }

    @media (min-width:1200px) {
      .grid {
        grid-template-columns: repeat(4, 1fr)
      }
    }

    @media (min-width:900px) and (max-width:1199px) {
      .grid {
        grid-template-columns: repeat(3, 1fr)
      }
    }

    @media (min-width:600px) and (max-width:899px) {
      .grid {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media (max-width:599px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    /* card */
    .card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform var(--trans), box-shadow var(--trans)
    }

    .card:focus-within,
    .card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 28px 80px rgba(12, 18, 30, 0.15)
    }

    .media {
      height: 160px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.02), transparent)
    }

    .media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 300ms
    }

    .overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.6), transparent);
      color: white;
      transform: translateY(100%);
      opacity: 0;
      transition: transform var(--trans), opacity var(--trans)
    }

    .card:hover .overlay,
    .card:focus-within .overlay {
      transform: translateY(0);
      opacity: 1
    }

    .card:hover img {
      transform: scale(1.06)
    }

    .body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .body h3 {
      margin: 0;
      font-size: 1rem
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.9rem
    }

    /* utilities */
    .icon-btn {
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-shadow: var(--shadow)
    }

    [tabindex]:focus {
      outline: 3px solid rgba(124, 58, 237, 0.12);
      outline-offset: 2px
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --trans: 1ms
      }

      .card,
      .overlay,
      .media img {
        transition: none !important
      }
    }
  </style>
</head>

    function svgPlaceholder(title, w = 1400, h = 900) {
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'>
    <defs><linearGradient id='g' x1='0' x2='1'><stop offset='0' stop-color='#ffb347'/><stop offset='1' stop-color='#7c3aed'/></linearGradient></defs>
    <rect width='100%' height='100%' fill='url(#g)'/>
    <text x='50%' y='50%' font-size='48' text-anchor='middle' fill='rgba(255,255,255,0.95)' font-family='sans-serif' dy='.3em'>${escapeHtml(title)}</text>
  </svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }
    function debounce(fn, ms = 200) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
    function groupBy(list, key) { return list.reduce((acc, item) => { (acc[item[key]] = acc[item[key]] || []).push(item); return acc; }, {}); }
    // Safe filename generator: "Vada Pav!" -> "vada-pav.html"
    function filenameFromSlug(slug) {
      if (!slug) return 'recipe.html';
      const s = String(slug).trim().toLowerCase();
      const normalized = s
        .replace(/\s+/g, '-')        // spaces -> dashes
        .normalize('NFKD')          // decompose accents
        .replace(/[^a-z0-9\-]/g, '') // remove other chars
        .replace(/\-+/g, '-')        // collapse dashes
        .replace(/^\-+|\-+$/g, '');  // trim dashes
      return (normalized || 'recipe') + '.html';
    }

    /* state & DOM */
    const state = { query: '', catFilters: new Set(), veg: 'all', ratingMin: 0, suggestions: [], suggestIndex: -1 };
    const dom = {
      categoryList: document.getElementById('categoryList'),
      contentArea: document.getElementById('contentArea'),
      searchInput: document.getElementById('searchInput'),
      suggestions: document.getElementById('suggestions'),
      clearFilters: null
    };

    /* pre-render preload */
    recipes.forEach(r => { if (!r.image) r.image = svgPlaceholder(r.title); const img = new Image(); img.src = r.image; });

    /* Init */
    renderCategoryList();
    bindSearch();
    bindFilters();
    renderContent();

    /* render categories */
    function renderCategoryList() {
      const counts = recipes.reduce((a, r) => { a[r.category] = (a[r.category] || 0) + 1; return a; }, {});
      const cats = Object.keys(counts).sort((a, b) => a.localeCompare(b));
      dom.categoryList.innerHTML = '';
      cats.forEach(cat => {
        const id = 'cat_' + cat.replace(/\s+/g, '_');

        const label = document.createElement('label'); label.htmlFor = id;
        const left = document.createElement('div'); left.style.display = 'flex'; left.style.alignItems = 'center';
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = id; cb.dataset.cat = cat;
        cb.addEventListener('change', onCategoryToggle);
        left.appendChild(cb); left.appendChild(document.createTextNode(' ' + cat));
        const right = document.createElement('div'); right.style.color = 'var(--muted)'; right.textContent = counts[cat];
        label.appendChild(left); label.appendChild(right);
        dom.categoryList.appendChild(label);
      });
    }

    /* render content grouped by category */
    function renderContent() {
      const filtered = applyFilters(recipes);
      const grouped = groupBy(filtered, 'category');
      dom.contentArea.innerHTML = '';
      if (!Object.keys(grouped).length) {
        dom.contentArea.innerHTML = `<div style="padding:40px;text-align:center"><h2>No recipes match your search. Request via Feedback.</h2></div>`;
        return;
      }
      Object.keys(grouped).sort().forEach(cat => {
        const section = document.createElement('section'); section.className = 'category';
        const header = document.createElement('h2'); header.textContent = `${cat} (${grouped[cat].length})`;
        section.appendChild(header);
        const grid = document.createElement('div'); grid.className = 'grid';
        grouped[cat].forEach(r => grid.appendChild(makeCard(r)));
        section.appendChild(grid);
        dom.contentArea.appendChild(section);
      });
    }

    /* create card (navigates to slug.html on click) */
    function makeCard(r) {
      const filename = filenameFromSlug(r.slug || r.title || r.id);
      // anchor wrapper so it works when JS is disabled and supports right-click/open-in-new-tab
      const link = document.createElement('a');
      link.href = filename;
      link.style.textDecoration = 'none';
      link.style.color = 'inherit';
      link.setAttribute('aria-label', r.title + ' recipe page');

      const art = document.createElement('article'); art.className = 'card'; art.tabIndex = 0;
      art.addEventListener('keydown', (e) => { if (e.key === 'Enter') link.click(); });

      // clicking the article follows link (anchor provides progressive enhancement)
      art.addEventListener('click', (e) => {
        if (e.target.tagName.toLowerCase() === 'input') return;
        location.href = link.href;
      });

      const media = document.createElement('div'); media.className = 'media';
      const img = document.createElement('img'); img.src = r.image; img.alt = r.title + ' image'; img.loading = 'lazy';
      media.appendChild(img);
      const overlay = document.createElement('div'); overlay.className = 'overlay';
      overlay.innerHTML = `<strong>${r.title}</strong><div style="font-size:0.85rem">${r.shortDescription}</div>`;
      media.appendChild(overlay);
      const body = document.createElement('div'); body.className = 'body';
      const h3 = document.createElement('h3'); h3.textContent = r.title;
      const meta = document.createElement('div'); meta.className = 'meta';
      const left = document.createElement('div'); left.innerHTML = starHtml(r.rating) + ` <span style="color:var(--muted);font-size:0.9rem">${r.rating.toFixed(1)}</span>`;
      const right = document.createElement('div'); right.style.color = 'var(--muted)'; right.textContent = r.category;
      meta.appendChild(left); meta.appendChild(right);
      body.appendChild(h3); body.appendChild(meta);
      art.appendChild(media); art.appendChild(body);

      link.appendChild(art);
      return link;
    }

    function starHtml(n) { const full = Math.round(n); let s = ''; for (let i = 0; i < 5; i++) s += `<span style="display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;background:linear-gradient(90deg,#ffd54a,#ffb347);opacity:${i < full ? 1 : 0.28}"></span>`; return s; }

    /* search & suggestions */
    function bindSearch() {
      const input = dom.searchInput;
      input.addEventListener('input', debounce(onSearchInput, 200));
      input.addEventListener('keydown', onSearchKey);
      document.addEventListener('click', e => { if (!e.composedPath().includes(dom.suggestions) && e.target !== input) hideSuggestions(); });
    }
    function onSearchInput(e) {
      state.query = e.target.value;
      if (!state.query.trim()) { hideSuggestions(); renderContent(); return; }
      const q = state.query.trim().toLowerCase();
      const tokens = q.split(/\s+/);
      const scored = recipes.map(r => {
        const hay = `${r.title} ${(r.tags || []).join(' ')} ${(r.ingredients || []).join(' ')} ${r.category}`.toLowerCase();
        let score = 0; for (const t of tokens) if (hay.includes(t)) score += 1 + (r.title.toLowerCase().includes(t) ? 2 : 0);
        return { r, score };
      }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 8).map(x => x.r);
      state.suggestions = scored;
      renderSuggestions(scored);
      renderContent();
    }
    function renderSuggestions(list) {
      dom.suggestions.innerHTML = ''; if (!list.length) { hideSuggestions(); return; }
      dom.suggestions.setAttribute('aria-hidden', 'false');
      list.forEach(r => {
        const a = document.createElement('a');
        a.className = 'suggest';
        a.tabIndex = 0;
        a.href = filenameFromSlug(r.slug || r.title || r.id);
        a.innerHTML = `<img src="${r.image}" alt="${r.title} thumb"><div><h4>${r.title}</h4><p>${r.category} · ${r.rating.toFixed(1)}★</p></div>`;
        // optional: open in new tab: a.target = '_blank';
        dom.suggestions.appendChild(a);
      });
      state.suggestIndex = -1;
    }

    function hideSuggestions() { dom.suggestions.innerHTML = ''; dom.suggestions.setAttribute('aria-hidden', 'true'); state.suggestions = []; state.suggestIndex = -1; }
    function onSearchKey(e) {
      const items = dom.suggestions.querySelectorAll('.suggest');
      if (!items.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); state.suggestIndex = Math.min(state.suggestIndex + 1, items.length - 1); focusSuggest(items); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); state.suggestIndex = Math.max(state.suggestIndex - 1, 0); focusSuggest(items); }
      else if (e.key === 'Enter') { e.preventDefault(); if (state.suggestIndex >= 0) items[state.suggestIndex].click(); else if (state.suggestions[0]) location.href = state.suggestions[0].slug + '.html'; }
      else if (e.key === 'Escape') { hideSuggestions(); dom.searchInput.blur(); }
    }
    function focusSuggest(items) { items.forEach((it, i) => it.classList.toggle('focused', i === state.suggestIndex)); if (state.suggestIndex >= 0) items[state.suggestIndex].focus(); }

    /* filters */
    function applyFilters(list) {
      const q = state.query.trim().toLowerCase();
      return list.filter(r => {
        if (state.catFilters.size > 0 && !state.catFilters.has(r.category)) return false;
        if (state.veg === 'veg' && !r.isVeg) return false;
        if (state.veg === 'nonveg' && r.isVeg) return false;
        if (state.ratingMin && r.rating < state.ratingMin) return false;
        if (q) {
          const hay = `${r.title} ${r.category} ${(r.tags || []).join(' ')} ${(r.ingredients || []).join(' ')}`.toLowerCase();
          const tokens = q.split(/\s+/).filter(Boolean);
          for (const t of tokens) if (!hay.includes(t)) return false;
        }
        return true;
      });
    }
    function onCategoryToggle(e) { const cat = e.target.dataset.cat; if (e.target.checked) state.catFilters.add(cat); else state.catFilters.delete(cat); renderContent(); }
    function bindFilters() {
      document.querySelectorAll('.chip[data-rating]').forEach(ch => {
        ch.addEventListener('click', ev => {
          const v = Number(ev.currentTarget.dataset.rating);
          if (state.ratingMin === v) { state.ratingMin = 0; ev.currentTarget.classList.remove('active'); } else {
            state.ratingMin = v; document.querySelectorAll('.chip[data-rating]').forEach(c => c.classList.remove('active')); ev.currentTarget.classList.add('active');
          }
          renderContent();
        });
      });
      Array.from(document.getElementsByName('veg')).forEach(r => r.addEventListener('change', () => { state.veg = document.querySelector('[name="veg"]:checked').value; renderContent(); }));
      const clearBtn = document.getElementById('clearFilters');
      if (clearBtn) clearBtn.addEventListener('click', () => {
        state.catFilters.clear(); state.veg = 'all'; state.ratingMin = 0; state.query = '';
        document.getElementById('searchInput').value = '';
        document.querySelectorAll('#categoryList input[type="checkbox"]').forEach(cb => cb.checked = false);
        document.querySelectorAll('[name="veg"]').forEach(r => r.checked = r.value === 'all');
        document.querySelectorAll('.chip[data-rating]').forEach(c => c.classList.remove('active'));
        hideSuggestions(); renderContent();
      });
    }

    /* initial helpers */
    function debounce(fn, ms = 200) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

    /* initial render */
    function renderAll() { renderContent(); }
    renderAll();
  </script>
